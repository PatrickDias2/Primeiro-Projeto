<!-- ==========================================
 DRAGÃO SEGUINDO O MOUSE
=========================================== -->

<script>

const dragao =
document.getElementById("dragao");

let mouseX = 0;
let mouseY = 0;

let dragaoX = 0;
let dragaoY = 0;


document.addEventListener(
"mousemove",
function(event) {

mouseX =
event.clientX;

mouseY =
event.clientY;

} );

function seguirMouse() {

dragaoX +=
(mouseX - dragaoX) * 0.08;

dragaoY +=
(mouseY - dragaoY) * 0.08;


dragao.style.left =
dragaoX + "px";

dragao.style.top =
dragaoY + "px";


requestAnimationFrame(
seguirMouse);

}


seguirMouse();
</script>
